[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["BackEnd*"]
namespaces = false

[tool.setuptools.package-data]
"BackEnd.app.Retrieval" = [
    "configs/*.toml",
    "configs/*.json",
    "resources/*.json",
    "resources/*.txt",
    "requirements*.txt",
    "taxonomy/requirements.txt",
]

[project]
name="sbtc-AIGuru"
version="0.1"

dependencies = [
    "requests>=2.32,<3",
    "crawl4ai==0.9.4",
    "faiss-cpu>=1.15.1",
    "pyarrow>=25.0.1",
    "sqlalchemy>=2.0,<3",
    "psycopg>=3.1,<4",
    "emoji>=2.16.0",
    "whitespace-normalizer>=2025.9.14911",
    "langchain>=1.4.6",
    "langchain-classic>=1.0.8",
    "langchain-openai>=1.7.2",
    "openai>=3.23.0",
]
