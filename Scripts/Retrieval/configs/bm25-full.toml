# Cấu hình BM25 Retrieval cho toàn bộ corpus 1.22M documents
# Căn cứ SPEC-bm25-medical-multilingual.md

corpus_snapshot = "newcorpus/links_corpus_vi_en_zh.parquet"
source_scope = "data_final/test_20k.jsonl"  # Sẽ trỏ tới full source shards khi tiến hành production
chunk_input = "data_final/chunks_format_v3_final"
run_dir = "artifacts/retrieval/bm25-full-v1"
queries_path = "newcorpus/query.parquet"

[bm25]
doc_k1 = 1.2
doc_b = 0.75
chunk_k1 = 1.2
chunk_b = 0.75

[boost_doc]
contents = 1.0
title = 1.5
section = 0.2
surface = 0.15
medical_exact = 0.5
concepts = 0.5

[boost_chunk]
contents = 1.0
title = 0.2
section = 0.2
surface = 0.15
medical_exact = 0.5
concepts = 0.5

[budgets]
candidate_docs_per_variant = 200
candidate_chunks_per_variant = 1000
max_selected_docs = 20
max_selected_chunks = 40
max_chunks_per_doc = 4
overlap_penalty_threshold = 0.7
rrf_k = 60

[quality_policy]
block_on_oversized_unresolved = true  # Bắt buộc kiểm tra 20 chunks unresolved trước khi build
allow_uncertain_format = true
require_parquet_membership = true

[query_bridge]
mode = "multilingual"
max_clauses = 128
translation_cache_dir = "artifacts/retrieval/translation_cache"
lexicon_path = "sbtc/Scripts/Retrieval/resources/medical_lexicon_vi_en_zh.sample.jsonl"

[resources]
jvm_heap = "3g"
batch_records = 1000
batch_bytes = 67108864 # 64 MiB
max_search_threads = 4
index_threads = 2
